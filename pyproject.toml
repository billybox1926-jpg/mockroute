[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mockroute"
version = "0.3.0"
description = "Zero-dependency local mock API server with latency and failure injection"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "billybox1926-jpg", email = "billybox1926@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mockroute = "mockroute:main"

[project.urls]
Homepage = "https://github.com/billybox1926-jpg/mockroute"
Repository = "https://github.com/billybox1926-jpg/mockroute"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "BLE", "FLY", "RUF"]
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
